<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Viewer | Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* ── Layout ─────────────────────────────────────────────── */
        body {
            margin: 0;
            background: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-display);
            overflow: hidden;
            height: 100dvh;
        }

        /* Split-panel wrapper */
        .split-layout {
            display: flex;
            width: 100vw;
            height: 100dvh;
            overflow: hidden;
        }

        /* ── Left: Viewer ───────────────────────────────────────── */
        .viewer-pane {
            flex: 0 0 62%;
            position: relative;
            background: #000;
            overflow: hidden;
        }

        #viewer-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #sketchfab-iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }

        /* ── Right: Info panel ──────────────────────────────────── */
        .info-pane {
            flex: 1 1 38%;
            min-width: 0;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            overflow-x: hidden;
            background: color-mix(in srgb, var(--bg-color) 85%, transparent);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-left: 1px solid var(--border-dim);
            padding: 32px 28px 40px;
            gap: 0;
            scrollbar-width: thin;
            scrollbar-color: var(--border-dim) transparent;
        }

        .info-pane::-webkit-scrollbar { width: 4px; }
        .info-pane::-webkit-scrollbar-track { background: transparent; }
        .info-pane::-webkit-scrollbar-thumb { background: var(--border-dim); border-radius: 2px; }

        /* ── Info panel sections ────────────────────────────────── */
        .info-top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: transparent;
            border: 1px solid var(--border-dim);
            color: var(--text-dim);
            padding: 8px 16px;
            text-decoration: none;
            font-size: 0.75rem;
            letter-spacing: 0.1rem;
            transition: color var(--ui-transition), background var(--ui-transition), border-color var(--ui-transition), transform var(--ui-transition);
            text-transform: uppercase;
            border-radius: 999px;
            font-family: var(--font-display);
        }
        .back-btn:hover {
            background: color-mix(in srgb, var(--text-primary) 8%, transparent);
            border-color: var(--border-strong);
            color: var(--text-primary);
            transform: translateY(-1px);
        }

        .model-title {
            font-family: 'Playfair Display', ui-serif, Georgia, serif;
            font-size: clamp(1.5rem, 2.5vw, 2.2rem);
            font-weight: 700;
            line-height: 1.15;
            color: var(--text-primary);
            margin: 0 0 14px;
            letter-spacing: -0.3px;
        }

        /* ── Description ────────────────────────────────────────── */
        .model-desc {
            color: var(--text-dim);
            font-size: 0.9rem;
            line-height: 1.65;
            margin: 0;
        }

        .model-desc.collapsible {
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .model-desc.expanded {
            display: block;
        }

        .desc-toggle {
            display: none;
            margin-top: 10px;
            background: transparent;
            border: 1px solid var(--border-dim);
            color: var(--text-dim);
            border-radius: 999px;
            padding: 5px 14px;
            font-family: var(--font-code);
            font-size: 0.65rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: color var(--ui-transition), background var(--ui-transition), border-color var(--ui-transition), transform var(--ui-transition);
        }
        .desc-toggle.visible { display: inline-flex; }
        .desc-toggle:hover {
            background: color-mix(in srgb, var(--text-primary) 8%, transparent);
            border-color: var(--border-strong);
            color: var(--text-primary);
            transform: translateY(-1px);
        }

        /* ── Divider ────────────────────────────────────────────── */
        .info-divider {
            width: 100%;
            height: 1px;
            background: var(--border-dim);
            margin: 22px 0;
        }

        /* ── View angle strip (inside panel) ────────────────────── */
        .view-strip-panel {
            display: none;
        }
        .view-strip-panel.visible {
            display: block;
        }

        .view-strip-header {
            margin-bottom: 10px;
        }

        .view-strip-label {
            font-family: var(--font-code);
            font-size: 0.65rem;
            letter-spacing: 0.12rem;
            text-transform: uppercase;
            color: var(--text-dim);
        }

        .view-thumb-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .view-thumb-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }
        .view-thumb {
            width: 56px;
            height: 56px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid transparent;
            opacity: 0.65;
            transition: border-color 0.2s, opacity 0.2s, transform 0.2s;
        }
        .view-thumb:hover {
            border-color: var(--border-strong);
            opacity: 1;
            transform: scale(1.06);
        }
        .view-thumb-label {
            font-size: 0.5rem;
            color: var(--text-dim);
            font-family: var(--font-code);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ── Meta row (date, stats) ─────────────────────────────── */
        .meta-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: var(--font-code);
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        .meta-item .meta-icon {
            display: flex;
            align-items: center;
            color: var(--text-dim);
            flex-shrink: 0;
        }

        /* Like button states */
        button.meta-item {
            transition: color var(--ui-transition);
        }
        button.meta-item:hover {
            color: var(--text-primary);
        }
        button.meta-item:hover .meta-icon { color: var(--text-primary); }
        button.meta-item.liked {
            color: #ff4d6d;
        }
        button.meta-item.liked .meta-icon { color: #ff4d6d; }
        button.meta-item.liked .meta-icon svg {
            fill: #ff4d6d;
            stroke: #ff4d6d;
        }
        @keyframes heartPop {
            0%   { transform: scale(1); }
            40%  { transform: scale(1.4); }
            70%  { transform: scale(0.9); }
            100% { transform: scale(1); }
        }
        button.meta-item.just-liked .meta-icon { animation: heartPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1); }

        /* ── Tech stack tags ────────────────────────────────────── */
        .tags-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tech-tag {
            border: 1px solid var(--border-dim);
            padding: 4px 12px;
            border-radius: 999px;
            font-family: var(--font-code);
            font-size: 0.7rem;
            color: var(--text-dim);
            letter-spacing: 0.5px;
            transition: color var(--ui-transition), border-color var(--ui-transition), background var(--ui-transition);
        }
        .tech-tag:hover {
            color: var(--text-primary);
            border-color: var(--border-strong);
            background: color-mix(in srgb, var(--text-primary) 5%, transparent);
        }

        /* ── Action buttons ─────────────────────────────────────── */
        .actions-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .btn-action {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 10px 18px;
            border-radius: 999px;
            font-family: var(--font-display);
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            text-decoration: none;
            cursor: pointer;
            transition: color var(--ui-transition), background var(--ui-transition), border-color var(--ui-transition), transform var(--ui-transition);
            border: 1px solid var(--border-dim);
            background: transparent;
            color: var(--text-dim);
        }
        .btn-action:hover {
            background: color-mix(in srgb, var(--text-primary) 8%, transparent);
            border-color: var(--border-strong);
            color: var(--text-primary);
            transform: translateY(-1px);
        }
        .btn-action.primary {
            background: var(--text-primary);
            color: var(--bg-color);
            border-color: transparent;
        }
        .btn-action.primary:hover {
            background: color-mix(in srgb, var(--text-primary) 88%, transparent);
            transform: translateY(-1px);
        }
        .btn-action svg {
            width: 13px;
            height: 13px;
            flex-shrink: 0;
            opacity: 0.8;
        }
        .btn-action.primary svg { opacity: 1; }

        #btn-download { display: none; }

        /* ── Loading overlay ────────────────────────────────────── */
        #loading-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.5s ease;
        }

        .loader-bar {
            width: 200px;
            height: 2px;
            background: var(--border-dim);
            margin-top: 20px;
            position: relative;
            overflow: hidden;
        }

        .loader-progress {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: var(--text-primary);
            transition: width 0.3s ease;
        }

        .status-text {
            font-size: 0.7rem;
            letter-spacing: 2px;
            color: var(--text-dim);
            margin-top: 10px;
            font-family: var(--font-code);
        }

        /* ── Lightbox ───────────────────────────────────────────── */
        .lightbox-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.93);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 18px;
            animation: fadeIn 0.2s ease;
        }
        #lightbox-img {
            max-width: 88vw;
            max-height: 80vh;
            object-fit: contain;
            border-radius: 10px;
            box-shadow: 0 0 80px rgba(0, 0, 0, 0.8);
        }
        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 28px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 8px 18px;
            cursor: pointer;
            font-family: var(--font-code);
            font-size: 0.75rem;
            border-radius: 999px;
            letter-spacing: 1px;
            transition: background 180ms ease, border-color 180ms ease, transform 180ms ease;
        }
        .lightbox-close:hover { background: rgba(255,255,255,0.14); transform: translateY(-1px); }
        .lightbox-label {
            font-family: var(--font-code);
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.8rem;
            letter-spacing: 2px;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* ── Responsive: mobile stacked ─────────────────────────── */
        @media (max-width: 768px) {
            body { overflow: auto; }

            .split-layout {
                flex-direction: column;
                height: auto;
                min-height: 100dvh;
            }

            .viewer-pane {
                flex: none;
                width: 100%;
                height: 50vh;
                min-height: 260px;
            }

            .info-pane {
                flex: none;
                width: 100%;
                height: auto;
                overflow-y: visible;
                border-left: none;
                border-top: 1px solid var(--border-dim);
                padding: 24px 20px 40px;
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
                background: var(--bg-color);
            }

            .model-title {
                font-size: 1.5rem;
            }

            .view-thumb { width: 48px; height: 48px; }

            #lightbox-img {
                max-width: 95vw;
                max-height: 75vh;
                border-radius: 6px;
            }
            .lightbox-close {
                top: 14px;
                right: 14px;
                padding: 6px 14px;
                font-size: 0.65rem;
            }
        }

        @media (max-width: 480px) {
            .info-pane { padding: 20px 16px 36px; }
            .model-title { font-size: 1.3rem; }
            .view-thumb { width: 42px; height: 42px; }
        }
    </style>
</head>
<body>
    <script>
        document.body.classList.add('page-enter');
        requestAnimationFrame(function() {
            document.body.classList.remove('page-enter');
        });
    </script>

    <!-- Loading overlay -->
    <div id="loading-overlay">
        <div class="loader-bar"><div id="loader-progress" class="loader-progress"></div></div>
        <div class="status-text" id="loader-status">SYNCING_ASSETS...</div>
    </div>

    <!-- Split layout -->
    <div class="split-layout">

        <!-- LEFT: 3D viewer -->
        <div class="viewer-pane">
            <div id="viewer-container">
                <!-- Sketchfab iframe or image fallback injected here -->
            </div>
        </div>

        <!-- RIGHT: Info panel -->
        <aside class="info-pane" id="info-pane">

            <!-- Top bar: back button -->
            <div class="info-top-bar">
                <a href="index.html" class="back-btn">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                    Back
                </a>
            </div>

            <!-- Title -->
            <h1 id="m-title" class="model-title">MODEL_VIEWER</h1>

            <!-- Description + toggle -->
            <p id="m-desc" class="model-desc">Loading metadata...</p>
            <button id="desc-toggle" class="desc-toggle" type="button" aria-expanded="false">MORE</button>

            <div class="info-divider"></div>

            <!-- View angle thumbnails (moved inside panel) -->
            <div class="view-strip-panel" id="view-strip">
                <div class="view-strip-header">
                    <span class="view-strip-label">View Angles</span>
                </div>
                <div class="view-thumb-wrapper" id="view-thumb-wrapper"></div>
            </div>
            <div class="info-divider" id="views-divider" style="display:none;"></div>

            <!-- Meta: date + Sketchfab stats -->
            <div class="meta-row" id="meta-row">
                <div class="meta-item" id="meta-date" style="display:none;">
                    <span class="meta-icon">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                            <line x1="16" y1="2" x2="16" y2="6"/>
                            <line x1="8" y1="2" x2="8" y2="6"/>
                            <line x1="3" y1="10" x2="21" y2="10"/>
                        </svg>
                    </span>
                    <span id="meta-date-val">—</span>
                </div>
                <button class="meta-item" id="meta-likes" type="button" style="display:none; background:transparent; border:none; padding:0; cursor:pointer; font-family:inherit; color:inherit;" aria-label="Like model">
                    <span class="meta-icon">
                        <svg id="meta-likes-svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                        </svg>
                    </span>
                    <span id="meta-likes-val">—</span>
                </button>
                <div class="meta-item" id="meta-views" style="display:none;">
                    <span class="meta-icon">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </span>
                    <span id="meta-views-val">—</span>
                </div>
            </div>

            <div class="info-divider" id="meta-divider" style="display:none;"></div>

            <!-- Tech stack tags -->
            <div class="tags-row" id="tags-row" style="display:none;"></div>
            <div class="info-divider" id="tags-divider" style="display:none;"></div>

            <!-- Action buttons -->
            <div class="actions-row">
                <!-- Download .glb/.gltf (shown only if blend_download_url exists) -->
                <a id="btn-download" class="btn-action primary" href="#" download>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    Download .glb
                </a>
                <!-- View on Sketchfab (shown only when sketchfab_uid exists) -->
                <a id="sketchfab-link" class="btn-action" href="#" target="_blank" rel="noopener noreferrer" style="display:none;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                        <polyline points="15 3 21 3 21 9"/>
                        <line x1="10" y1="14" x2="21" y2="3"/>
                    </svg>
                    View on Sketchfab
                </a>
            </div>

        </aside>
    </div>

    <!-- Lightbox Modal -->
    <div class="lightbox-overlay" id="lightbox" style="display:none;" onclick="closeLightbox()">
        <button class="lightbox-close" onclick="event.stopPropagation(); closeLightbox()">X CLOSE</button>
        <img id="lightbox-img" src="" alt="Model view">
        <div id="lightbox-label" class="lightbox-label"></div>
    </div>

    <!-- Page transition handler -->
    <script>
        (function() {
            var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (reduceMotion) return;
            document.querySelectorAll('a[href]').forEach(function(link) {
                link.addEventListener('click', function(e) {
                    var url;
                    try { url = new URL(link.href, window.location.href); } catch (err) { return; }
                    if (url.origin !== window.location.origin) return;
                    if (link.target && link.target !== '_self') return;
                    e.preventDefault();
                    document.body.classList.add('page-leave');
                    setTimeout(function() { window.location.href = url.href; }, 260);
                });
            });
        })();
    </script>

    <!-- Main module -->
    <script type="module">
        import { db } from "/js/firebase-config.js";
        import { doc, getDoc, setDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const urlParams    = new URLSearchParams(window.location.search);
        const projectId    = urlParams.get('id');

        const loaderProgress  = document.getElementById('loader-progress');
        const loaderStatus    = document.getElementById('loader-status');
        const loadingOverlay  = document.getElementById('loading-overlay');
        const modelDesc       = document.getElementById('m-desc');
        const descToggle      = document.getElementById('desc-toggle');

        // ── Helpers ──────────────────────────────────────────────────────────

        function formatCount(n) {
            if (n == null) return '—';
            if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
            return String(n);
        }

        function formatDate(value) {
            if (!value) return null;
            let d;
            // Firestore Timestamp object
            if (value && typeof value.toDate === 'function') {
                d = value.toDate();
            } else if (typeof value === 'string' || typeof value === 'number') {
                d = new Date(value);
            } else {
                return null;
            }
            if (isNaN(d.getTime())) return null;
            return d.toLocaleDateString('id-ID', { year: 'numeric', month: 'numeric', day: 'numeric' });
        }

        function showMeta() {
            const metaRow     = document.getElementById('meta-row');
            const metaDivider = document.getElementById('meta-divider');
            const hasVisible  = [...metaRow.querySelectorAll('.meta-item')].some(el => el.style.display !== 'none');
            if (hasVisible) metaDivider.style.display = '';
        }

        // ── Description toggle ───────────────────────────────────────────────

        function setupDescriptionToggle() {
            if (!modelDesc || !descToggle) return;
            modelDesc.classList.remove('collapsible', 'expanded');
            descToggle.classList.remove('visible');
            descToggle.textContent = 'MORE';
            descToggle.setAttribute('aria-expanded', 'false');

            requestAnimationFrame(() => {
                const needsToggle = modelDesc.scrollHeight > modelDesc.clientHeight + 4 || modelDesc.textContent.length > 200;
                if (!needsToggle) return;
                modelDesc.classList.add('collapsible');
                descToggle.classList.add('visible');
            });
        }

        descToggle?.addEventListener('click', () => {
            if (!modelDesc) return;
            const isExpanded = modelDesc.classList.toggle('expanded');
            modelDesc.classList.toggle('collapsible', !isExpanded);
            descToggle.textContent = isExpanded ? 'LESS' : 'MORE';
            descToggle.setAttribute('aria-expanded', String(isExpanded));
        });

        // ── Likes (Firestore-backed, localStorage tracks user) ──────────────

        function getLikeStorageKey(id) { return `liked_project_${id}`; }
        function hasUserLiked(id) {
            try { return localStorage.getItem(getLikeStorageKey(id)) === '1'; } catch { return false; }
        }
        function markUserLiked(id) {
            try { localStorage.setItem(getLikeStorageKey(id), '1'); } catch {}
        }
        function unmarkUserLiked(id) {
            try { localStorage.removeItem(getLikeStorageKey(id)); } catch {}
        }

        function setLikesUI(count, liked) {
            const btn = document.getElementById('meta-likes');
            const val = document.getElementById('meta-likes-val');
            if (!btn || !val) return;
            val.textContent = formatCount(count);
            btn.style.display = 'inline-flex';
            btn.classList.toggle('liked', !!liked);
        }

        async function toggleLike() {
            const btn = document.getElementById('meta-likes');
            if (!btn || btn.dataset.busy === '1') return;
            btn.dataset.busy = '1';

            const liked   = hasUserLiked(projectId);
            const valEl   = document.getElementById('meta-likes-val');
            const current = parseInt(valEl?.textContent?.replace(/[^\d]/g, '') || '0', 10) || 0;
            // Optimistic UI update
            const nextLiked = !liked;
            const nextCount = Math.max(0, current + (nextLiked ? 1 : -1));
            setLikesUI(nextCount, nextLiked);
            if (nextLiked) {
                btn.classList.add('just-liked');
                setTimeout(() => btn.classList.remove('just-liked'), 500);
            }

            try {
                await setDoc(doc(db, 'projects', projectId), {
                    like_count: increment(nextLiked ? 1 : -1)
                }, { merge: true });
                if (nextLiked) markUserLiked(projectId); else unmarkUserLiked(projectId);
            } catch (err) {
                // Roll back on failure
                console.error('Like failed:', err);
                setLikesUI(current, liked);
            } finally {
                btn.dataset.busy = '0';
            }
        }

        document.getElementById('meta-likes')?.addEventListener('click', toggleLike);

        window.openLightbox = function(imgUrl, label) {
            document.getElementById('lightbox-img').src = imgUrl;
            document.getElementById('lightbox-label').textContent = label;
            document.getElementById('lightbox').style.display = 'flex';
        };
        window.closeLightbox = function() {
            document.getElementById('lightbox').style.display = 'none';
            document.getElementById('lightbox-img').src = '';
        };
        document.addEventListener('keydown', e => { if (e.key === 'Escape') window.closeLightbox(); });

        // ── View angle thumbnails ─────────────────────────────────────────────

        function renderViewStrip(views) {
            const viewKeys       = ['front','back','left','right','top','bottom'];
            const availableViews = viewKeys.filter(k => views[k]);
            if (!availableViews.length) return;

            const stripPanel   = document.getElementById('view-strip');
            const thumbWrapper = document.getElementById('view-thumb-wrapper');
            const viewsDivider = document.getElementById('views-divider');

            thumbWrapper.innerHTML = availableViews.map(key => `
                <div class="view-thumb-container" onclick="openLightbox('${views[key]}', '${key.toUpperCase()} VIEW')">
                    <img src="${views[key]}" class="view-thumb" alt="${key} view" loading="lazy">
                    <span class="view-thumb-label">${key}</span>
                </div>
            `).join('');

            stripPanel.classList.add('visible');
            viewsDivider.style.display = '';
        }

        // ── Sketchfab public API (date only) ─────────────────────────────────

        async function fetchSketchfabDate(uid) {
            try {
                const res = await fetch(`https://api.sketchfab.com/v3/models/${uid}`);
                if (!res.ok) return;
                const json = await res.json();

                const published = json.publishedAt;
                if (published) {
                    const formatted = formatDate(published);
                    if (formatted) {
                        const el = document.getElementById('meta-date');
                        document.getElementById('meta-date-val').textContent = formatted;
                        el.style.display = 'flex';
                        showMeta();
                    }
                }
            } catch (err) {
                console.warn('Sketchfab API fetch failed:', err);
            }
        }

        // ── Render helpers ────────────────────────────────────────────────────

        function renderImageHero(url) {
            const container = document.getElementById('viewer-container');
            container.innerHTML = `<img src="${url}" style="max-height:100%; max-width:100%; object-fit:contain; border-radius:8px;" alt="Model preview">`;
            loaderProgress.style.width = "100%";
            setTimeout(() => {
                loadingOverlay.style.opacity = "0";
                setTimeout(() => loadingOverlay.style.display = "none", 500);
            }, 300);
        }

        function renderSketchfab(uid) {
            loaderStatus.innerText = "INITIALIZING_SKETCHFAB...";
            const container = document.getElementById('viewer-container');
            const iframe    = document.createElement('iframe');
            iframe.id       = "sketchfab-iframe";
            iframe.src      = `https://sketchfab.com/models/${uid}/embed?autostart=1&internal=1&tracking=0&ui_ar=0&ui_infos=0&ui_watermark=0`;
            iframe.allow    = "autoplay; fullscreen; xr-spatial-tracking";

            const sfLink = document.getElementById('sketchfab-link');
            if (sfLink) {
                sfLink.href = `https://sketchfab.com/models/${uid}`;
                sfLink.style.display = 'inline-flex';
            }

            iframe.onload = () => {
                loaderProgress.style.width = "100%";
                setTimeout(() => {
                    loadingOverlay.style.opacity = "0";
                    setTimeout(() => loadingOverlay.style.display = "none", 500);
                }, 500);
            };

            container.appendChild(iframe);

            // Fetch Sketchfab date only (view count now tracked in Firestore)
            fetchSketchfabDate(uid);
        }

        // ── Main init ─────────────────────────────────────────────────────────

        async function initViewer() {
            if (!projectId) {
                loaderStatus.innerText = "ERROR: NO_ID_SPECIFIED";
                return;
            }

            try {
                loaderProgress.style.width = "30%";
                const docRef  = doc(db, "projects", projectId);
                const docSnap = await getDoc(docRef);

                if (!docSnap.exists()) {
                    loaderStatus.innerText = "ERROR: PROJECT_NOT_FOUND";
                    return;
                }

                const data = docSnap.data();

                // Title
                document.getElementById('m-title').innerText = data.title || 'UNTITLED';

                // Description
                if (modelDesc) {
                    modelDesc.innerText = data.description || '';
                    setupDescriptionToggle();
                }

                // Likes from Firestore (always show button, even if zero)
                const likeCount = typeof data.like_count === 'number' ? data.like_count : 0;
                setLikesUI(likeCount, hasUserLiked(projectId));
                showMeta();

                // View count from Firestore (works for all project types)
                // Show current count immediately, then ask server if this view should be counted
                const currentViews = typeof data.view_count === 'number' ? data.view_count : 0;
                const viewsEl = document.getElementById('meta-views');
                document.getElementById('meta-views-val').textContent = formatCount(currentViews);
                viewsEl.style.display = 'flex';
                showMeta();

                // Ask server to validate this view (IP-based cooldown, 24h per project)
                // Server returns { counted: true } only if this IP hasn't viewed in 24h
                fetch(`/api/view/${projectId}`, { method: 'POST' })
                    .then(r => r.json())
                    .then(result => {
                        if (!result.counted) return; // Already counted within 24h, skip
                        // Increment in Firestore and update UI optimistically
                        document.getElementById('meta-views-val').textContent = formatCount(currentViews + 1);
                        setDoc(doc(db, 'projects', projectId), {
                            view_count: increment(1)
                        }, { merge: true }).catch(err => console.warn('View count increment failed:', err));
                    })
                    .catch(() => {
                        // Server unreachable (e.g. static hosting) — fall back to sessionStorage throttle
                        const sessionKey = `viewed_${projectId}`;
                        if (!sessionStorage.getItem(sessionKey)) {
                            sessionStorage.setItem(sessionKey, '1');
                            document.getElementById('meta-views-val').textContent = formatCount(currentViews + 1);
                            setDoc(doc(db, 'projects', projectId), {
                                view_count: increment(1)
                            }, { merge: true }).catch(err => console.warn('View count increment failed:', err));
                        }
                    });

                // Created date from Firestore (if no Sketchfab uid, or as fallback)
                if (data.created_at && !data.sketchfab_uid) {
                    const formatted = formatDate(data.created_at);
                    if (formatted) {
                        const el = document.getElementById('meta-date');
                        document.getElementById('meta-date-val').textContent = formatted;
                        el.style.display = 'flex';
                        showMeta();
                    }
                }

                // Tech stack tags
                const stack = data.stack || [];
                if (stack.length) {
                    const tagsRow    = document.getElementById('tags-row');
                    const tagsDivider = document.getElementById('tags-divider');
                    tagsRow.innerHTML = stack.map(t => `<span class="tech-tag">${t}</span>`).join('');
                    tagsRow.style.display = 'flex';
                    tagsDivider.style.display = '';
                }

                // Download .glb/.gltf button
                if (data.blend_download_url) {
                    const btn = document.getElementById('btn-download');
                    btn.href = data.blend_download_url;
                    btn.style.display = 'inline-flex';
                }

                loaderProgress.style.width = "60%";

                // View angle thumbnails
                const views = data.model_views || {};
                renderViewStrip(views);

                // Viewer: Sketchfab > front view > icon_url
                if (data.sketchfab_uid) {
                    renderSketchfab(data.sketchfab_uid);
                } else if (views.front) {
                    renderImageHero(views.front);
                } else if (data.icon_url) {
                    renderImageHero(data.icon_url);
                } else {
                    loaderStatus.innerText = "ERROR: NO_DISPLAYABLE_CONTENT";
                }

            } catch (err) {
                console.error(err);
                loaderStatus.innerText = "ERROR: " + (err.code || err.message);
            }
        }

        initViewer();
    </script>
</body>
</html>
